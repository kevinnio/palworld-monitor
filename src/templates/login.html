{% extends "base.html" %}

{% block content %}
<main class="shell login-shell">
    <div class="login-layout">
        <div class="login-art">
            <img class="mascot" src="{{ url_for('static', filename='Sunglasses_Cattiva.webp') }}" alt="" width="408" height="608">
        </div>
        <section class="login-form" aria-labelledby="loginTitle">
            <h1 id="loginTitle">Admin Login</h1>
            {% if error %}<p class="form-message error-message" role="alert">{{ error }}</p>{% endif %}
            {% if warning %}<p class="form-message warning-message" role="alert">{{ warning }}</p>{% endif %}
            {% if info %}<p class="form-message info-message" role="status">{{ info }}</p>{% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <label class="remember-me"><input type="checkbox" id="remember" name="remember" value="yes"> Remember me for 7 days</label>
                <button type="submit" class="btn btn-primary login-btn" {% if locked_out %}disabled{% endif %}>
                    {% if locked_out %}Locked Out{% else %}Login {{ icon('arrow') }}{% endif %}
                </button>
            </form>
        </section>
    </div>
</main>
{% endblock %}
