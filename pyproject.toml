[project]
name = "palworld-monitor"
version = "0.2.1"
description = "PalWorld dedicated server monitor with auto start/stop and web admin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "blinker>=1.9.0",
    "certifi>=2025.6.15",
    "charset-normalizer>=3.4.2",
    "click>=8.2.1",
    "colorama>=0.4.6",
    "flask>=3.1.1",
    "flask-limiter>=3.5.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2.1",
    "idna>=3.10",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.2",
    "psutil>=7.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "schedule>=1.2.2",
    "urllib3>=2.5.0",
    "watchdog>=6.0.0",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.15.16",
    "poethepoet>=0.39",
    "playwright>=1.61.0",
    "pyinstaller>=6.0.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["B", "SIM", "C90", "PLR"]
ignore = ["PLR2004", "SIM112"]  # test magic values, Windows env var casing

[tool.ruff.lint.per-file-ignores]
"test/**" = ["SIM"]  # test setup code, not product logic

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 12
max-branches = 15
max-statements = 60

[tool.poe.tasks]
start = "python -m src.main"
test = "pytest -m 'not e2e' --ignore=test/e2e"
smoke = "pytest -m e2e test/e2e"
lint = "ruff check src/ test/"
format = "ruff format src/ test/"
build-exe = "python build_exe.py"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--capture=no"]
markers = [
    "windows: Windows-specific tests",
    "linux: Linux-specific tests",
    "e2e: End-to-end tests that require a running app",
]
filterwarnings = [
    "ignore::DeprecationWarning:flask_login.*",
]
